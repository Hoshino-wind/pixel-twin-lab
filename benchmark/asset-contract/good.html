<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      width: 220px;
      height: 120px;
      background: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .stage {
      position: relative;
      width: 220px;
      height: 120px;
      background: #f8fafc;
    }
    .logo {
      position: absolute;
      left: 20px;
      top: 24px;
      width: 32px;
      height: 32px;
      display: block;
      overflow: hidden;
    }
    .thumb {
      position: absolute;
      left: 72px;
      top: 20px;
      width: 96px;
      height: 56px;
      display: block;
      overflow: hidden;
      border-radius: 8px;
    }
    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }
  </style>
</head>
<body>
  <div class="stage">
    <span class="logo" data-element="nav-logo" data-element-asset-id="nav-logo-asset" data-asset-type="icon">
      <img src="element-assets/nav-logo.png" alt="" draggable="false">
    </span>
    <span class="thumb" data-element="place-photo" data-element-asset-id="place-photo-asset" data-asset-type="image">
      <img src="element-assets/place-photo.png" alt="" draggable="false">
    </span>
  </div>
</body>
</html>
