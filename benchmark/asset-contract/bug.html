<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      width: 220px;
      height: 120px;
      background: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .stage {
      position: relative;
      width: 220px;
      height: 120px;
      background: #f8fafc;
    }
    .logo {
      position: absolute;
      left: 20px;
      top: 24px;
      width: 32px;
      height: 32px;
      display: block;
    }
    .thumb {
      position: absolute;
      left: 72px;
      top: 20px;
      width: 96px;
      height: 56px;
      display: block;
      border-radius: 8px;
      background: linear-gradient(135deg, #0ea5e9, #f97316);
    }
  </style>
</head>
<body>
  <div class="stage">
    <span class="logo" data-element="nav-logo">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="#14b8a6"></circle>
        <path d="M16 4 L28 24 H4 Z" fill="#f97316"></path>
      </svg>
    </span>
    <span class="thumb" data-element="place-photo" aria-hidden="true"></span>
  </div>
</body>
</html>
