<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      width: 360px;
      height: 220px;
      background: #f8fafc;
      color: #0f172a;
      font-family: Arial, sans-serif;
    }
    .stage {
      position: relative;
      width: 360px;
      height: 220px;
      background: #f8fafc;
    }
    .card {
      position: absolute;
      left: 24px;
      top: 24px;
      width: 240px;
      height: 104px;
      box-sizing: border-box;
      background: #f1f5f9;
      border: 2px solid #94a3b8;
      border-radius: 4px;
      box-shadow: none;
      opacity: 1;
    }
    .title {
      position: absolute;
      left: 24px;
      top: 20px;
      width: 120px;
      height: 20px;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="stage">
    <section class="card" data-component="trip-card">
      <div class="title" data-element="trip-title">Rome Getaway</div>
    </section>
  </div>
</body>
</html>
