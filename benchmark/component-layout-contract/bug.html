<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      width: 360px;
      height: 220px;
      background: #f8fafc;
      color: #0f172a;
      font-family: Arial, sans-serif;
    }
    .stage {
      position: relative;
      width: 360px;
      height: 220px;
      background: #f8fafc;
    }
    .card {
      position: absolute;
      left: 56px;
      top: 40px;
      width: 120px;
      height: 60px;
      box-sizing: border-box;
      border: 1px solid #dbe3ec;
      border-radius: 8px;
      background: #ffffff;
    }
    .title {
      position: absolute;
      left: 40px;
      top: 38px;
      width: 80px;
      height: 18px;
      font-size: 14px;
      line-height: 18px;
      font-weight: 600;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="stage">
    <section class="card" data-component="uptime-card"></section>
    <div class="title" data-element="uptime-title">Uptime</div>
  </div>
</body>
</html>
