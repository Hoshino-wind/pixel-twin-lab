<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      width: 320px;
      height: 180px;
      background: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .stage {
      position: relative;
      width: 320px;
      height: 180px;
      overflow: hidden;
      background: #f8fafc;
    }
    .hero-bg {
      position: absolute;
      left: 20px;
      top: 20px;
      width: 240px;
      height: 120px;
      object-fit: cover;
      background:
        linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(59, 130, 246, 0.16)),
        repeating-linear-gradient(0deg, #dfe8ef 0 2px, transparent 2px 24px),
        repeating-linear-gradient(90deg, #e7edf3 0 2px, transparent 2px 28px),
        #f3f7fb;
      border-radius: 14px;
      z-index: 0;
    }
    .baked-label {
      position: absolute;
      left: 48px;
      top: 92px;
      width: 124px;
      height: 44px;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #d5dde8;
      border-radius: 10px;
      background: #ffffff;
      color: #0f172a;
      font-size: 14px;
      line-height: 16px;
      z-index: 0;
    }
    .baked-label b {
      float: right;
      font-size: 18px;
      line-height: 18px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <img
      data-element="hero-bg"
      class="hero-bg"
      alt=""
      src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
    >
    <div class="baked-label" aria-hidden="true">
      <span>Bookings</span>
      <b>7/10</b>
    </div>
  </div>
</body>
</html>
